# Agent-Wun Configuration
model:
  provider: freeride
  api_base: http://localhost:11343
  name: auto
  ctx_length: 8192

agents:
  default:
    profile: default
    tools: [web_search, files, code, browser, voice]
    skills: []

webui:
  host: 127.0.0.1
  port: 5000

providers:
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
  groq:
    api_key: ${GROQ_API_KEY}
  cerebras:
    api_key: ${CEREBRAS_API_KEY}
  ollama:
    base_url: http://localhost:11434

memory:
  db_path: tmp/memory.db

state:
  db_path: tmp/sessions.db

learning:
  storage_path: tmp/learning
