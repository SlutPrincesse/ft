[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agent-wun"
version = "1.0.0"
description = "Unified autonomous agent framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Agent-Wun Contributors"}]

[project.scripts]
agent-wun = "core.main:main"
agent-wun-api = "api.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
