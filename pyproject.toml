[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pyshard-p9"
version = "1.0.0"
description = "Python-centric reverse-engineering, SRP sharding, and synthesis engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiofiles>=24.0.0",
    "python-multipart>=0.0.12",
    "libcst>=1.5.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "ruff>=0.6.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "networkx>=3.0.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0", "black>=24.0"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
